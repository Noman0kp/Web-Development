<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline-CSS</title>
</head>

<!-- WE'LL ADD ATTRIBUTES TO THE TAGS AND CHANGE THE APPEARANCE OF OUR WEBPAGE. -->
<body style="background-color: rgb(68, 223, 234);">
    
    <!-- BELOW WE CHANGED THE FONT-COLOUR, ALIGNED THE HEADING IN CENTRE AND CHANGED THE FONT STYLE -->
    <h1 style="color: rgb(96, 1, 1); text-align: center; font-family: cursive;">This is the heading!</h1>

    <!-- BELOW WE CHANGED THE FONT COLOUR AND FONT SIZE AND THE BG-COLOUR OF THE ELEMENT-->
    <p style="font-family: cursive; color: rgb(57, 68, 191); font-size:x-large; background-color: beige;">A cow has 4 legs. <br> A cow gives milk. <br> A cow eats grass. <br> A cow is an animal.</p>

</body>
</html>

<!-- INLINE CSS IS NOT THE OPTIMAL APPROACH SINCE IT MAKES THE CODE CONGESTED AND DIFFICULT
TO READ AND UNDERSTAND. HENCE A BETTER WAY IF "INTERNAL-CSS" WHERE WE WILL UPDATE 
PROPERTIES OF TAGS AND ELEMENTS IN THE HEAD SEPARATELY.  -->
