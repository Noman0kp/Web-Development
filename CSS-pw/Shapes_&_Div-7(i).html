<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <title>Shapes And Div</title>

        <link rel="stylesheet" href="Shapes_&_Div.css">

    <body>

        <div>   <h4>This Is A Box!</h4> </div>

        <!-- ANY TAG WE WRITE INSIDE OF <DIV> BECOMES IT'S CHILD. ALL THE CHANGES WE WANT
            TO MAKE FOR CHILD WILL HAPPEN w.r.t. PARENT <DIV> 
                
            SINCE WE'LL BE REQUIRED TO MAKE MULTIPLE DIVs FOR OUR WEBSITE, WE'LL USE IDs
            FOR DIFFERENT DIVs TO MAKE CHANGES TO THEM SEPARATELY.
            BELOW IS HOW YOU MAKE MULTIPLE DIVs : -->

        <div id="Box1"> <h4>I am Box-1!</h4> </div>   
        
        
        
    
    </body>

</html>
